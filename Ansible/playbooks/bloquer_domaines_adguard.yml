- name: Bloquer des domaines dans AdGuard Home
  hosts: Adguard
  gather_facts: false

  vars_files:
    - ../vars/generated_vars.yml

  tasks:
    - name: Verifier que la liste des domaines est definie
      ansible.builtin.assert:
        that:
          - domains is defined
          - domains | length > 0
        fail_msg: "Erreur : la variable domains est absente ou vide"

    - name: Afficher les domaines a bloquer
      ansible.builtin.debug:
        msg: |
          Ajout de {{ domains | length }} domaine(s) a la liste de blocage :
          {{ domains | join(', ') }}

    - name: Verifier si le fichier de configuration existe
      ansible.builtin.stat:
        path: /srv/adguard/adguard-conf/AdGuardHome.yaml
      register: config_file

    - name: Echouer si le fichier de configuration n'existe pas
      ansible.builtin.fail:
        msg: "Le fichier de configuration AdGuard n'existe pas"
      when: not config_file.stat.exists

    - name: Creer une sauvegarde de la configuration actuelle
      ansible.builtin.copy:
        src: /srv/adguard/adguard-conf/AdGuardHome.yaml
        dest: "/srv/adguard/adguard-conf/AdGuardHome.yaml.backup.{{ lookup('pipe', 'date +%s') }}"
        remote_src: yes
        mode: '0600'

    - name: Normaliser la section user_rules en liste YAML
      ansible.builtin.replace:
        path: /srv/adguard/adguard-conf/AdGuardHome.yaml
        regexp: '^user_rules:\s*\[\]\s*$'
        replace: 'user_rules:'
      register: user_rules_normalized

    - name: Ajouter les domaines a la section user_rules (avec syntaxe wildcard)
      ansible.builtin.lineinfile:
        path: /srv/adguard/adguard-conf/AdGuardHome.yaml
        insertafter: '^user_rules:'
        line: "  - \"||{{ item }}^\""
        state: present
      loop: "{{ domains }}"
      register: domains_added

    - name: Redemarrer AdGuard Home si necessaire
      community.docker.docker_container:
        name: adguard
        state: started
        restart: yes
      when: user_rules_normalized is changed or domains_added is changed or adguard_force_restart | default(false) | bool

    - name: Attendre le redemarrage d'AdGuard
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 53
        delay: 5
        timeout: 60
      when: user_rules_normalized is changed or domains_added is changed or adguard_force_restart | default(false) | bool

    - name: Resume
      ansible.builtin.debug:
        msg: |
          ================================================================
          Blocage de domaines AdGuard termine
          ================================================================

          Domaines bloques :
          {% for d in domains %}
          - {{ d }}
          {% endfor %}
