---
# tasks file for roles/Nextcloud

- name: Créer le dossier Nextcloud
  ansible.builtin.file:
    path: /srv/nextcloud
    state: directory
    mode: '0755'

- name: Déployer le docker-compose.yml pour Nextcloud
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /srv/nextcloud/docker-compose.yml
    mode: '0644'
  register: nextcloud_docker_compose_deployed

- name: Lancer les conteneurs Nextcloud
  community.docker.docker_compose_v2:
    project_src: /srv/nextcloud
    state: present
    recreate: "{{ 'always' if nextcloud_docker_compose_deployed.changed else 'never' }}"

- name: Attendre que Nextcloud soit complètement démarré
  ansible.builtin.uri:
    url: "http://localhost:{{ nextcloud_port }}/status.php"
    status_code: 200
    timeout: 5
  register: nextcloud_health_check
  until: nextcloud_health_check.status == 200
  retries: 30
  delay: 10

- name: Déployer le script de configuration LDAP
  ansible.builtin.template:
    src: ldap-config.sh.j2
    dest: /srv/nextcloud/ldap-config.sh
    mode: '0755'
  when: nextcloud_ldap_enabled | default(true)

- name: Exécuter la configuration LDAP
  ansible.builtin.command:
    cmd: /srv/nextcloud/ldap-config.sh
  register: ldap_config_result
  changed_when: "'Configuration LDAP terminée avec succès' in ldap_config_result.stdout"
  when: nextcloud_ldap_enabled | default(true)

- name: Afficher le résultat de la configuration LDAP
  ansible.builtin.debug:
    var: ldap_config_result.stdout_lines
  when:
    - nextcloud_ldap_enabled | default(true)
    - ldap_config_result is defined

- name: Afficher les informations de connexion
  ansible.builtin.debug:
    msg:
      - "╔════════════════════════════════════════════════════════════════╗"
      - "║           Nextcloud déployé avec succès !                     ║"
      - "╚════════════════════════════════════════════════════════════════╝"
      - ""
      - "📍 URL d'accès: http://{{ ansible_host }}:{{ nextcloud_port }}"
      - ""
      - "👤 Compte administrateur local:"
      - "   - Utilisateur: {{ nextcloud_admin_user }}"
      - "   - Mot de passe: {{ nextcloud_admin_password }}"
      - ""
      - "🔐 Authentification LDAP/Active Directory configurée:"
      - "   - Serveur AD: {{ nextcloud_ldap_host }}"
      - "   - Base DN: {{ nextcloud_ldap_base_dn }}"
      - "   - Domaine: {{ nextcloud_domain }}"
      - ""
      - "🔑 Connexion avec les utilisateurs Active Directory:"
      - "   - Format: utilisateur (sAMAccountName)"
      - "   - Exemple: jdupont"
      - "   - Mot de passe: mot de passe Active Directory"
      - ""
      - "💡 Commandes utiles:"
      - "   - Lister les utilisateurs LDAP: docker exec -u www-data {{ nextcloud_container_name }} php occ ldap:show-remnants"
      - "   - Tester la config LDAP: docker exec -u www-data {{ nextcloud_container_name }} php occ ldap:test-config s01"
      - "   - Voir les logs: docker logs {{ nextcloud_container_name }}"
